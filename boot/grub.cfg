# WeeK OS GRUB Configuration
# Boot menu for WeeK OS

set timeout=5
set default=0

# Colors
set color_normal=white/blue
set color_highlight=white/light-blue

menuentry "WeeK OS 1.0.0" {
    set root='(hd0,msdos1)'
    linux /boot/kernel.bin
    initrd /boot/initrd.img
}

menuentry "WeeK OS 1.0.0 (Safe Mode)" {
    set root='(hd0,msdos1)'
    linux /boot/kernel.bin safe
    initrd /boot/initrd.img
}

menuentry "WeeK OS 1.0.0 (Recovery)" {
    set root='(hd0,msdos1)'
    linux /boot/kernel.bin recovery
    initrd /boot/initrd.img
}

menuentry "Memory Test (memtest86+)" {
    linux16 /boot/memtest.bin
}
