name: WeeK OS ISO Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y debootstrap squashfs-tools xorriso grub-pc-bin grub-common mtools
    
    - name: Create root filesystem
      run: |
        sudo debootstrap --arch=amd64 --include=ubuntu-desktop,kde-plasma-desktop,dolphin,konsole,firefox,libreoffice,vlc,gimp,neofetch,htop jammy rootfs http://archive.ubuntu.com/ubuntu/
    
    - name: Install WeeK OS apps
      run: |
        sudo chroot rootfs /bin/bash -c "
          echo 'user:weekos' | chpasswd
          echo 'root:weekos' | chpasswd
          mkdir -p /etc/sddm.conf.d
          echo '[Autologin]
          User=user' > /etc/sddm.conf.d/autologin.conf
          mkdir -p /usr/bin
          echo '#!/bin/bash
          kdialog --title WeeK --msgbox Hoş Geldiniz!' > /usr/bin/weekos-welcome
          chmod +x /usr/bin/weekos-welcome
          mkdir -p /home/user/Desktop
          chown -R 1000:1000 /home/user
        "
    
    - name: Build ISO
      run: |
        sudo lb config --distribution jammy --archive-areas 'main restricted universe multiverse'
        sudo lb build 2>&1 | tail -20
        ls -la *.iso 2>/dev/null
    
    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: weekos-desktop
        path: "*.iso"
        retention-days: 30
