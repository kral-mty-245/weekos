name: WeeK OS ISO Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Build WeeK OS ISO
      run: |
        set -e
        
        echo "=== WeeK OS Builder ==="
        
        sudo apt-get update -qq
        sudo apt-get install -y -qq debootstrap squashfs-tools xorriso
        
        mkdir -p build/{rootfs,image/{casper,boot/grub}}
        
        echo "Rootfs olusturuluyor..."
        sudo debootstrap --arch=amd64 jammy build/rootfs http://archive.ubuntu.com/ubuntu/
        
        echo "Paketler kuruluyor..."
        sudo chroot build/rootfs /bin/bash << 'CHROOT'
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq \
            ubuntu-desktop \
            kde-standard \
            sddm \
            dolphin \
            konsole \
            firefox \
            libreoffice \
            vlc \
            gimp \
            htop \
            git \
            curl
            
          echo "user:weekos" | chpasswd
          echo "root:weekos" | chpasswd
          useradd -m -s /bin/bash user || true
          echo "user:weekos" | chpasswd
          
          mkdir -p /etc/sddm.conf.d
          echo -e "[Autologin]\nUser=user" > /etc/sddm.conf.d/autologin.conf
          
          mkdir -p /home/user/Desktop
          for f in dolphin konsole systemsettings; do
            echo -e "[Desktop Entry]\nName=$f\nExec=/usr/bin/$f\nTerminal=false\nType=Application" > /home/user/Desktop/$f.desktop
          done
          chmod +x /home/user/Desktop/*.desktop
          chown -R 1000:1000 /home/user
        CHROOT
        
        echo "Kernel kopyalaniyor..."
        cp build/rootfs/boot/vmlinuz-* build/image/casper/vmlinuz
        cp build/rootfs/boot/initrd.img-* build/image/casper/initrd
        
        echo "Squashfs olusturuluyor..."
        sudo mksquashfs build/rootfs build/image/casper/filesystem.squashfs -comp xz -e boot
        
        cat > build/image/boot/grub/grub.cfg << 'EOF'
        set timeout=5
        set default=0
        menuentry "WeeK OS 1.0.0" {
          linux /casper/vmlinuz boot=casper quiet splash ---
          initrd /casper/initrd
        }
        menuentry "WeeK OS (Safe Mode)" {
          linux /casper/vmlinuz boot=casper nomodeset ---
          initrd /casper/initrd
        }
        EOF
        
        echo "ISO olusturuluyor..."
        cd build/image
        xorriso -as mkisofs -r -J -b boot/grub/grub.cfg -no-emul-boot -boot-load-size 4 -boot-info-table -o ../../weekos-desktop-amd64.iso .
        cd ../..
        
        ls -la weekos-desktop-amd64.iso

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: weekos-desktop
        path: weekos-desktop-amd64.iso
        retention-days: 30
