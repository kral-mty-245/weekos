name: WeeK OS ISO Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          debootstrap \
          squashfs-tools \
          xorriso \
          grub-pc-bin \
          grub-common \
          mtools \
          genisoimage \
          live-build

    - name: Configure live-build
      run: |
        sudo lb clean
        sudo lb config \
          --distribution jammy \
          --archive-areas "main restricted universe multiverse" \
          --bootloaders "grub-efi" \
          --binary-images iso-hybrid \
          --debian-installer none \
          --bootappend-live "boot=live components username=user hostname=weekos"

    - name: Add custom packages
      run: |
        echo "kde-plasma-desktop" | sudo tee -a config/package-lists/my.list.chroot
        echo "dolphin" | sudo tee -a config/package-lists/my.list.chroot
        echo "konsole" | sudo tee -a config/package-lists/my.list.chroot
        echo "firefox" | sudo tee -a config/package-lists/my.list.chroot
        echo "thunderbird" | sudo tee -a config/package-lists/my.list.chroot
        echo "libreoffice" | sudo tee -a config/package-lists/my.list.chroot
        echo "vlc" | sudo tee -a config/package-lists/my.list.chroot
        echo "gimp" | sudo tee -a config/package-lists/my.list.chroot
        echo "neofetch" | sudo tee -a config/package-lists/my.list.chroot
        echo "htop" | sudo tee -a config/package-lists/my.list.chroot
        echo "git" | sudo tee -a config/package-lists/my.list.chroot
        echo "curl" | sudo tee -a config/package-lists/my.list.chroot
        echo "wget" | sudo tee -a config/package-lists/my.list.chroot
        echo "sddm" | sudo tee -a config/package-lists/my.list.chroot

    - name: Build ISO
      run: |
        sudo lb build 2>&1 | tail -50

    - name: Find ISO
      run: |
        ls -la *.iso 2>/dev/null || echo "ISO not found"
        find . -name "*.iso" -type f 2>/dev/null

    - name: Upload ISO
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: weekos-desktop
        path: "*.iso"
        retention-days: 30
